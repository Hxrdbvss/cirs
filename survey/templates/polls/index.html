{% extends 'base.html' %}
{% block title %}Все опросы{% endblock %}
{% block content %}
<h1 class="mb-4">Доступные опросы</h1>
<ul class="list-group">
{% for survey in surveys %}
    <li class="list-group-item">
        <a href="{% url 'polls:detail' survey.id %}">{{ survey.title }}</a>
    </li>
{% endfor %}
</ul>
{% endblock %}
